$kind: http-example
request:
  url: "{{baseUrl}}/auth/logout"
  method: POST
  headers:
    Authorization: Bearer {{token}}
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "message": "Logged out successfully"
        }
      }
order: 1000
