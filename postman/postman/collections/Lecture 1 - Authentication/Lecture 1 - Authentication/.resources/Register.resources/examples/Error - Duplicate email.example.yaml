$kind: http-example
request:
  url: "{{baseUrl}}/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "name": "Sarah Connor",
        "email": "admin@test.com",
        "password": "Passw0rd!"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Validation failed",
        "errors": [
          {
            "field": "email",
            "message": "Email is already registered"
          }
        ]
      }
order: 2000
