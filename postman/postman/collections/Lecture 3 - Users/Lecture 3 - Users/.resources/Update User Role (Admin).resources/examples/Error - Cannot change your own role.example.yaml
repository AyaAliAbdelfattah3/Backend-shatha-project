$kind: http-example
request:
  url: "{{baseUrl}}/users/64f1a2b3c4d5e6f7a8b9c0d1/role"
  method: PATCH
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "role": "user"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "You cannot change your own role",
        "errors": []
      }
order: 2000
