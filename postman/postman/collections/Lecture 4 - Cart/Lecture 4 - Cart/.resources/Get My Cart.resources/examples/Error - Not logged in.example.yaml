$kind: http-example
request:
  url: "{{baseUrl}}/cart"
  method: GET
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Not authorized, no token provided",
        "errors": []
      }
order: 3000
