$kind: http-example
request:
  url: "{{baseUrl}}/auth/register"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "name": "Sarah Connor",
        "email": "sarah.connor@example.com",
        "password": "Passw0rd!"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "user": {
            "id": "64f1a2b3c4d5e6f7a8b9c0d2",
            "name": "Sarah Connor",
            "email": "sarah.connor@example.com",
            "role": "user"
          },
          "token": "{{json_web_token_15hl}}"
        }
      }
order: 1000
