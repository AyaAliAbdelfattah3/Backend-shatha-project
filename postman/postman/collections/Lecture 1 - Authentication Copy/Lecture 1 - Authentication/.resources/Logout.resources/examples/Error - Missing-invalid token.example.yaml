$kind: http-example
name: Error - Missing/invalid token
request:
  url: "{{baseUrl}}/auth/logout"
  method: POST
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Not authorized, no token provided",
        "errors": []
      }
order: 2000
