$kind: http-example
request:
  url: "{{baseUrl}}/users"
  method: GET
  headers:
    Authorization: Bearer {{token}}
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Forbidden: admin access required",
        "errors": []
      }
order: 2000
