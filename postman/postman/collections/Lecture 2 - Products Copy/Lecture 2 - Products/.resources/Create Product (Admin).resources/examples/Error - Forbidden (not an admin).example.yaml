$kind: http-example
request:
  url: "{{baseUrl}}/products"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "name": "Some Product",
        "description": "d",
        "price": 10,
        "image": "https://picsum.photos/seed/x/600/600",
        "category": "Electronics"
      }
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Forbidden: admin access required",
        "errors": []
      }
order: 2000
