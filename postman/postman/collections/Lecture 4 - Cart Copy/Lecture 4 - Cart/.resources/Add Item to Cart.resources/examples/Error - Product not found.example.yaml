$kind: http-example
request:
  url: "{{baseUrl}}/cart/items"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "productId": "64f1a2b3c4d5e6f7a8b9c9c9",
        "quantity": 1
      }
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Product not found",
        "errors": []
      }
order: 2000
