$kind: http-example
request:
  url: "{{baseUrl}}/cart/items"
  method: POST
  headers:
    Content-Type: application/json
    Authorization: Bearer {{token}}
  body:
    type: text
    content: |-
      {
        "productId": "not-a-real-id",
        "quantity": 0
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Validation failed",
        "errors": [
          {
            "field": "productId",
            "message": "productId must be a valid id"
          },
          {
            "field": "quantity",
            "message": "Quantity must be at least 1"
          }
        ]
      }
order: 3000
