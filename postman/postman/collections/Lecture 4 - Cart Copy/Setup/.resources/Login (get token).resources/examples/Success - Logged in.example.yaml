$kind: http-example
request:
  url: "{{baseUrl}}/auth/login"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: text
    content: |-
      {
        "email": "user1@test.com",
        "password": "User1123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "success": true,
        "data": {
          "user": {
            "id": "64f1a2b3c4d5e6f7a8b9c0d2",
            "name": "Test User One",
            "email": "user1@test.com",
            "role": "user"
          },
          "token": ""
        }
      }
order: 1000
